<ion-content [fullscreen]="true">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-title>
        TaskMaster
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <ng-container *ngIf="TaskList.length > 0 && isLoaded; else noTask">
    <ion-list>
      <ion-item *ngFor="let task of TaskList">
        {{task.label}}
        <br>
        {{task.description}}
        <br>
        {{task.limitDate}}
        <br>
        <ion-item>
          <ion-button (click)="onUpdateTask(task)">Update Task</ion-button>
          <ion-button (click)="onDeleteTask(task.id)">Delete Task</ion-button>
        </ion-item>
      </ion-item>
    </ion-list>
  </ng-container>

  <ng-template #noTask>
    Aucune tâche en cours
  </ng-template>
   

   <ion-button (click)="onCreateTask()">Create a new task</ion-button>
</ion-content>
